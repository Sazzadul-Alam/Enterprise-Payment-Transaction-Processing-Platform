server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**

        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**

        - id: ledger-service-route
          uri: ${LEDGER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/ledger/**

        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**

        - id: audit-service-route
          uri: ${AUDIT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/audit/**

        - id: reconciliation-service-route
          uri: ${RECONCILIATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/reconciliation/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
