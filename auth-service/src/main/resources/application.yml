server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_AUTH_USER:auth_user}
    password: ${DB_AUTH_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AuthServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns DDL; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3e5f7a8b0c2d4e6f8a1b3c5d7e9f0a2b4c}
  access-token-expiration: 900000     # 15 minutes in ms
  refresh-token-expiration: 604800000 # 7 days in ms
  issuer: enterprise-auth-service

security:
  lockout:
    max-attempts: 5
    lock-duration-minutes: 15

